{% extends "admin/base.html" %}{% block admin_title %}Edit advertisement{% endblock %}{% block admin_content %}<section class="panel"><form method="post" enctype="multipart/form-data" class="admin-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Title<input name="title" value="{{ ad.title }}" required></label><label>CTA text<input name="cta_text" value="{{ ad.cta_text }}"></label><label>CTA link<input name="cta_link" value="{{ ad.cta_link }}"></label><label>Placement<select name="placement"><option {% if ad.placement=="home" %}selected{% endif %}>home</option><option {% if ad.placement=="shop" %}selected{% endif %}>shop</option></select></label></div><label>Description<input name="description" value="{{ ad.description }}"></label><label>Current image URL<input name="image_url" value="{{ ad.image_url }}"></label><label>Replace image<input type="file" name="image" accept=".jpg,.jpeg,.png,.webp,.gif"></label><label><input type="checkbox" name="enabled" {% if ad.enabled %}checked{% endif %}> Enabled</label><button class="btn btn-primary">Save</button><a class="btn btn-outline" href="{{ url_for('admin_ads') }}">Cancel</a></form></section>{% endblock %}
