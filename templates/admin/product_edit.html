{% extends "admin/base.html" %}{% block admin_title %}Edit product{% endblock %}{% block admin_content %}<section class="panel"><form method="post" enctype="multipart/form-data" class="admin-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Name<input name="name" value="{{ product.name }}" required></label><label>Product ID<input name="product_id" value="{{ product.product_id }}"></label><label>Brand<input name="brand" value="{{ product.brand }}"></label><label>Category<select name="category_id"><option value="">No category</option>{% for c in categories %}<option value="{{ c.id }}" {% if product.category_id==c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></label><label>Price<input type="number" step="0.01" name="price" value="{{ product.price }}"></label><label>Discount price<input type="number" step="0.01" name="discount_price" value="{{ product.discount_price or '' }}"></label><label>Stock<input type="number" name="stock" value="{{ product.stock }}"></label></div><label>Short description<input name="short_description" value="{{ product.short_description }}"></label><label>Description<textarea name="description">{{ product.description }}</textarea></label><label>Specifications<textarea name="specifications">{{ product.specifications }}</textarea></label><label>Tags<input name="tags" value="{{ product.tags }}"></label><label>Add more images<input type="file" name="images" accept=".jpg,.jpeg,.png,.webp,.gif" multiple></label><div class="checks"><label><input type="checkbox" name="featured" {% if product.featured %}checked{% endif %}> Featured</label><label><input type="checkbox" name="best_seller" {% if product.best_seller %}checked{% endif %}> Best seller</label><label><input type="checkbox" name="new_arrival" {% if product.new_arrival %}checked{% endif %}> New arrival</label><label><input type="checkbox" name="sale_item" {% if product.sale_item %}checked{% endif %}> Sale item</label></div><button class="btn btn-primary">Save changes</button><a class="btn btn-outline" href="{{ url_for('admin_products') }}">Cancel</a></form></section>{% endblock %}
