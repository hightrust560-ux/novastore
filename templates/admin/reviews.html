{% extends "admin/base.html" %}{% block admin_title %}Reviews{% endblock %}{% block admin_content %}<section class="panel"><div class="table-wrap"><table><thead><tr><th>Product</th><th>Customer</th><th>Rating</th><th>Comment</th><th>Action</th></tr></thead><tbody>{% for r in reviews %}<tr><td>{{ r.product.name }}</td><td>{{ r.customer_name }}</td><td>★ {{ r.rating }}</td><td>{{ r.comment }}</td><td><form method="post" action="{{ url_for('admin_review_delete',review_id=r.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-small danger">Delete</button></form></td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
