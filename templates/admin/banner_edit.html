{% extends "admin/base.html" %}{% block admin_title %}Edit banner{% endblock %}{% block admin_content %}<section class="panel"><form method="post" enctype="multipart/form-data" class="admin-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Title<input name="title" value="{{ banner.title }}" required></label><label>Button text<input name="button_text" value="{{ banner.button_text }}"></label><label>Button link<input name="button_link" value="{{ banner.button_link }}"></label><label>Sort order<input type="number" name="sort_order" value="{{ banner.sort_order }}"></label></div><label>Subtitle<input name="subtitle" value="{{ banner.subtitle }}"></label><label>Current image URL<input name="image_url" value="{{ banner.image_url }}"></label><label>Replace image<input type="file" name="image" accept=".jpg,.jpeg,.png,.webp,.gif"></label><label><input type="checkbox" name="enabled" {% if banner.enabled %}checked{% endif %}> Enabled</label><button class="btn btn-primary">Save</button><a class="btn btn-outline" href="{{ url_for('admin_banners') }}">Cancel</a></form></section>{% endblock %}
