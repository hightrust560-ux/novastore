{% extends "admin/base.html" %}{% block admin_title %}Store settings{% endblock %}{% block admin_content %}<section class="panel"><form method="post" class="admin-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Store name<input name="store_name" value="{{ values.store_name }}"></label><label>Logo URL<input name="logo_url" value="{{ values.logo_url }}" placeholder="https://..."></label><label>Currency<input name="currency" value="{{ values.currency }}"></label><label>Phone<input name="phone" value="{{ values.phone }}"></label><label>Email<input name="email" value="{{ values.email }}"></label></div><label>Description<input name="store_description" value="{{ values.store_description }}"></label><label>Address<input name="address" value="{{ values.address }}"></label><label>Facebook URL<input name="facebook" value="{{ values.facebook }}"></label><label>Instagram URL<input name="instagram" value="{{ values.instagram }}"></label><label>YouTube URL<input name="youtube" value="{{ values.youtube }}"></label><label>Footer text<input name="footer_text" value="{{ values.footer_text }}"></label><div class="form-grid"><label>Delivery charge<input name="delivery_charge" value="{{ values.delivery_charge }}"></label><label>Free delivery minimum<input name="free_delivery_minimum" value="{{ values.free_delivery_minimum }}" type="number" min="0" step="0.01"></label><label>Minimum order amount<input name="minimum_order_amount" value="{{ values.minimum_order_amount }}" type="number" min="0" step="0.01"></label></div><button class="btn btn-primary">Save settings</button></form></section>{% endblock %}
