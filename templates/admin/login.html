<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf_token() }}"><title>Admin Login</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body class="login-page"><form class="login-card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="brand"><span class="brand-mark">N</span> NovaStore</div><h1>Admin sign in</h1><p>Manage products, orders and store content.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<label>Username<input name="username" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="btn btn-primary full">Sign in</button><a class="text-link" href="{{ url_for('home') }}">← Back to store</a></form></body></html>
