{% extends "admin/base.html" %}{% block admin_title %}Categories{% endblock %}{% block admin_content %}<section class="panel"><form method="post" class="inline-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input name="name" placeholder="Category name" required><button class="btn btn-primary">Add category</button></form></section><section class="panel"><div class="table-wrap"><table><thead><tr><th>Name</th><th>Products</th><th>Action</th></tr></thead><tbody>{% for c in categories %}<tr><td><form class="inline-form" method="post" action="{{ url_for('admin_category_edit',category_id=c.id) }}"><input name="name" value="{{ c.name }}"><button class="btn btn-small">Save</button></form></td><td>{{ c.products|length }}</td><td><form method="post" action="{{ url_for('admin_category_delete',category_id=c.id) }}" onsubmit="return confirm('Delete category? Products will remain but become uncategorized.')"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-small danger">Delete</button></form></td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
